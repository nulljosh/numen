name: Numen
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "202608302150"

targets:
  Numen-iOS:
    type: application
    # One target, two destinations — there are no platform-specific sources to exclude,
    # so a second target would only add a build graph to maintain.
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    settings:
      base:
        # Target name is Numen-iOS (it builds both platforms); the app is just Numen.
        PRODUCT_NAME: Numen
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.numen
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        # Missing this ships an iconless app, and it only shows up on the Mac build.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: QMM486NPYC
        CODE_SIGN_STYLE: Automatic
        # Without an entitlements file the signed bundle carries no application-identifier
        # while the embedded profile does — Apple rejects that with ITMS-90886.
        CODE_SIGN_ENTITLEMENTS: Numen.entitlements
        # Per-SDK, not one shared file: the iOS file's `application-identifier` is not a
        # valid macOS entitlement and makes Mac profile creation fail outright.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Numen-macOS.entitlements

schemes:
  Numen-iOS:
    build:
      targets:
        Numen-iOS: all
    run:
      config: Debug
    archive:
      config: Release
    shared: true
